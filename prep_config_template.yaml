# ========================================================================
#   NextLAMP Data Preparation Configuration (YAML)
# ========================================================================

out_dir: "dataset_babesia"
threads: 4
max_genomes_per_taxon: 20
run_nextlamp: true

# --- Option A: Specify Taxonomic Group Names or TaxIDs ---
target_taxa:
  - "Babesia canis"

common_taxa:
  - "Babesia"

background_taxa:
  - "Apicomplexa"
  - "Canis lupus familiaris"

