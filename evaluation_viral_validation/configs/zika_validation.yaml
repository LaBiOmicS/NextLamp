# ========================================================================
#   NextLAMP Configuration — Zika Virus (ZIKV) Validation Suite
# ========================================================================

target_fasta: "evaluation_viral_validation/data/zika_ref.fa"
index_prefix: "evaluation_viral_validation/data/zika_bg_idx"
targets_list: "evaluation_viral_validation/data/targets_list.txt"
background_list: "evaluation_viral_validation/data/background_list.txt"
out: "evaluation_viral_validation/results/zika_nextlamp_results.json"
threads: 8
max_sets: 10

# --- Thermodynamic & Specificity Thresholds ---
min_gc: 35.0
max_gc: 65.0
min_tm: 56.0
max_tm: 66.0
min_tm_diff: 3.0
check_dimers: true
include_loops: true
min_target_coverage: 0.85
max_target_mismatches: 1
max_background_mismatches: 2

# --- Spatial & Amplicon Distance Constraints (bp) ---
dist_f3_f2_min: 0
dist_f3_f2_max: 25
dist_f2_f1c_min: 40
dist_f2_f1c_max: 60
dist_inner_min: 120
dist_inner_max: 180
dist_b1c_b2_min: 40
dist_b1c_b2_max: 60
dist_b2_b3_min: 0
dist_b2_b3_max: 25
dist_f1c_b1c_max: 90
